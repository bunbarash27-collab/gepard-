name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Раннер уже содержит Android SDK; докачиваем только нужные компоненты.
      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaxiOS-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-os-debug-apk
          path: TaxiOS-debug.apk
      # Публикуем APK в релиз "latest", чтобы его можно было скачать без входа в GitHub.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TaxiOS-debug.apk \
            --title "TAXI OS — последняя сборка" \
            --notes "Автосборка из коммита ${GITHUB_SHA::7}. Скачайте TaxiOS-debug.apk и установите на телефон (Android 8.0+)."
